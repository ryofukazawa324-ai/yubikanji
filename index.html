<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7fb" />
  <title>指書き文字認識</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1d1d1f;
      --sub: #6e6e73;
      --line: #d9d9df;
      --accent: #2563eb;
      --danger: #b42318;
      --shadow: 0 12px 30px rgba(0,0,0,.07);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    }
    .wrap { width: min(100%, 560px); margin: 0 auto; }
    header { margin-bottom: 16px; }
    h1 { margin: 0 0 6px; font-size: clamp(26px, 7vw, 36px); letter-spacing: -.02em; }
    .lead { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.6; }
    .card {
      background: var(--card);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 14px;
    }
    .canvas-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 440px;
      border: 2px solid #bfc1c8;
      border-radius: 18px;
      overflow: hidden;
      background-color: #fff;
      background-image:
        linear-gradient(to right, transparent calc(50% - .5px), #ededf1 calc(50% - .5px), #ededf1 calc(50% + .5px), transparent calc(50% + .5px)),
        linear-gradient(to bottom, transparent calc(50% - .5px), #ededf1 calc(50% - .5px), #ededf1 calc(50% + .5px), transparent calc(50% + .5px));
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    .hint {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: #c3c4c9;
      font-weight: 700;
      font-size: 18px;
      transition: opacity .15s ease;
    }
    .hint.hidden { opacity: 0; }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      min-height: 48px;
      padding: 11px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: default; }
    .secondary { background: #f0f0f3; color: var(--text); }
    .primary { grid-column: 1 / -1; background: var(--accent); color: white; font-size: 17px; }
    .status {
      min-height: 24px;
      margin: 10px 2px 0;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.5;
    }
    .status.error { color: var(--danger); }
    .section-title { margin: 0 0 10px; font-size: 15px; color: var(--sub); font-weight: 700; }
    .result-row { display: flex; gap: 8px; }
    #result {
      width: 100%;
      min-width: 0;
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      font: inherit;
      font-size: 24px;
      background: #fff;
      color: var(--text);
    }
    .small-btn { flex: 0 0 auto; min-width: 74px; background: #f0f0f3; }
    .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .last-recognized {
      margin: 10px 0 0;
      min-height: 24px;
      color: var(--sub);
      font-size: 14px;
    }
    .last-recognized strong { color: var(--accent); font-size: 22px; }
    .note { color: var(--sub); font-size: 12px; line-height: 1.7; margin: 12px 2px 0; }
    @media (min-width: 480px) {
      .card { padding: 20px; }
      .toolbar { grid-template-columns: 1fr 1fr 1.4fr; }
      .primary { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>指書き文字認識</h1>
      <p class="lead">1文字書いて「認識する」を押すと、認識候補の1位を自動で入力します。そのまま次の文字を書けます。</p>
    </header>

    <section class="card" aria-label="手書き入力">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="pad" aria-label="手書きキャンバス"></canvas>
        <div class="hint" id="hint">ここに文字を書く</div>
      </div>
      <div class="toolbar">
        <button class="secondary" id="undoBtn" type="button">一画戻す</button>
        <button class="secondary" id="clearBtn" type="button">全部消す</button>
        <button class="primary" id="recognizeBtn" type="button">認識して入力</button>
      </div>
      <div class="status" id="status" aria-live="polite">文字を書いてください。</div>
    </section>

    <section class="card" aria-label="入力結果">
      <p class="section-title">入力結果</p>
      <div class="result-row">
        <input id="result" type="text" inputmode="text" autocomplete="off" placeholder="認識した文字が自動で入ります" aria-label="入力結果" />
        <button class="small-btn" id="backspaceBtn" type="button">⌫</button>
      </div>
      <p class="last-recognized" id="lastRecognized">まだ認識していません。</p>
      <div class="result-actions">
        <button class="secondary" id="copyBtn" type="button">コピー</button>
        <button class="secondary" id="resultClearBtn" type="button">結果を消す</button>
      </div>
      <p class="note">認識時のみ、書いた線の座標データをGoogle Input Toolsの手書き認識サービスへ送信します。このページ自体には手書きデータを保存しません。試作版のため、外部サービス側の仕様変更で認識できなくなる場合があります。</p>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('pad');
      const wrap = document.getElementById('canvasWrap');
      const hint = document.getElementById('hint');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const lastRecognizedEl = document.getElementById('lastRecognized');
      const undoBtn = document.getElementById('undoBtn');
      const clearBtn = document.getElementById('clearBtn');
      const recognizeBtn = document.getElementById('recognizeBtn');
      const copyBtn = document.getElementById('copyBtn');
      const backspaceBtn = document.getElementById('backspaceBtn');
      const resultClearBtn = document.getElementById('resultClearBtn');

      const ctx = canvas.getContext('2d', { alpha: true });
      let strokes = [];
      let drawing = false;
      let currentStroke = null;
      let startTime = 0;
      let logicalWidth = 320;
      let logicalHeight = 320;
      let recognizing = false;

      function resizeCanvas() {
        const rect = wrap.getBoundingClientRect();
        logicalWidth = Math.max(1, Math.round(rect.width));
        logicalHeight = Math.max(1, Math.round(rect.height));
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.round(logicalWidth * dpr);
        canvas.height = Math.round(logicalHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        redraw();
      }

      function pointFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(logicalWidth, e.clientX - rect.left)),
          y: Math.max(0, Math.min(logicalHeight, e.clientY - rect.top)),
          t: Math.max(0, Date.now() - startTime)
        };
      }

      function drawStroke(stroke) {
        if (!stroke || stroke[0].length === 0) return;
        const xs = stroke[0];
        const ys = stroke[1];
        ctx.strokeStyle = '#161616';
        ctx.lineWidth = Math.max(5, logicalWidth * 0.022);
        ctx.beginPath();
        ctx.moveTo(xs[0], ys[0]);
        if (xs.length === 1) {
          ctx.lineTo(xs[0] + 0.01, ys[0] + 0.01);
        } else {
          for (let i = 1; i < xs.length; i++) ctx.lineTo(xs[i], ys[i]);
        }
        ctx.stroke();
      }

      function redraw() {
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);
        strokes.forEach(drawStroke);
        if (currentStroke) drawStroke(currentStroke);
        hint.classList.toggle('hidden', strokes.length > 0 || !!currentStroke);
        updateButtons();
      }

      function updateButtons() {
        const hasInk = strokes.length > 0 || (currentStroke && currentStroke[0].length > 0);
        undoBtn.disabled = strokes.length === 0 || recognizing;
        clearBtn.disabled = !hasInk || recognizing;
        recognizeBtn.disabled = !hasInk || recognizing;
      }

      function beginStroke(e) {
        if (recognizing) return;
        e.preventDefault();
        if (startTime === 0) startTime = Date.now();
        drawing = true;
        canvas.setPointerCapture?.(e.pointerId);
        const p = pointFromEvent(e);
        currentStroke = [[p.x], [p.y], [p.t]];
        redraw();
      }

      function moveStroke(e) {
        if (!drawing || !currentStroke) return;
        e.preventDefault();
        const p = pointFromEvent(e);
        const xs = currentStroke[0];
        const ys = currentStroke[1];
        const last = xs.length - 1;
        if (last >= 0 && Math.hypot(p.x - xs[last], p.y - ys[last]) < 1.2) return;
        currentStroke[0].push(p.x);
        currentStroke[1].push(p.y);
        currentStroke[2].push(p.t);
        redraw();
      }

      function endStroke(e) {
        if (!drawing || !currentStroke) return;
        e.preventDefault();
        drawing = false;
        strokes.push(currentStroke);
        currentStroke = null;
        redraw();
        setStatus(`${strokes.length}画 入力中`);
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', isError);
      }

      function clearPad() {
        strokes = [];
        currentStroke = null;
        drawing = false;
        startTime = 0;
        redraw();
      }

      async function recognize() {
        if (recognizing || strokes.length === 0) return;
        recognizing = true;
        updateButtons();
        setStatus('認識しています…');

        const payload = {
          app_version: 0.4,
          api_level: '537.36',
          device: navigator.userAgent,
          input_type: 0,
          options: 'enable_pre_space',
          requests: [{
            writing_guide: {
              writing_area_width: logicalWidth,
              writing_area_height: logicalHeight
            },
            pre_context: resultEl.value,
            max_num_results: 5,
            max_completions: 0,
            ink: strokes
          }]
        };

        try {
          const response = await fetch('https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=demopage', {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const ok = Array.isArray(data) && data[0] === 'SUCCESS';
          const items = ok && data[1] && data[1][0] && Array.isArray(data[1][0][1]) ? data[1][0][1] : [];
          if (!items.length) throw new Error('候補が取得できませんでした');

          const top = items[0];
          resultEl.value += top;
          lastRecognizedEl.innerHTML = `認識結果：<strong>${escapeHtml(top)}</strong>`;
          clearPad();
          setStatus(`「${top}」を自動入力しました。次の文字を書けます。`);
        } catch (err) {
          console.error(err);
          setStatus('手書き認識サービスへ接続できませんでした。もう一度試してください。', true);
        } finally {
          recognizing = false;
          updateButtons();
        }
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
      }

      canvas.addEventListener('pointerdown', beginStroke, { passive: false });
      canvas.addEventListener('pointermove', moveStroke, { passive: false });
      canvas.addEventListener('pointerup', endStroke, { passive: false });
      canvas.addEventListener('pointercancel', endStroke, { passive: false });

      undoBtn.addEventListener('click', () => {
        if (strokes.length > 0) strokes.pop();
        if (strokes.length === 0) startTime = 0;
        redraw();
        setStatus(strokes.length ? `${strokes.length}画 入力中` : '文字を書いてください。');
      });

      clearBtn.addEventListener('click', () => {
        clearPad();
        setStatus('文字を書いてください。');
      });

      recognizeBtn.addEventListener('click', recognize);

      backspaceBtn.addEventListener('click', () => {
        resultEl.value = Array.from(resultEl.value).slice(0, -1).join('');
        resultEl.focus();
      });

      resultClearBtn.addEventListener('click', () => {
        resultEl.value = '';
        lastRecognizedEl.textContent = 'まだ認識していません。';
        resultEl.focus();
      });

      copyBtn.addEventListener('click', async () => {
        const text = resultEl.value;
        if (!text) {
          setStatus('コピーする文字がありません。', true);
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          setStatus('入力結果をコピーしました。');
        } catch {
          resultEl.select();
          document.execCommand('copy');
          setStatus('入力結果をコピーしました。');
        }
      });

      const resizeObserver = new ResizeObserver(resizeCanvas);
      resizeObserver.observe(wrap);
      window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
      resizeCanvas();
      updateButtons();
    })();
  </script>
</body>
</html>
